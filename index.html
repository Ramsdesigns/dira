<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צייד הדירות</title>
<meta name="description" content="כל הדירות מיד 2, מדלן ופייסבוק במקום אחד, מדורגות לפי מה שחשוב לך.">
<meta name="theme-color" content="#1c1f28">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/48.png">
<link rel="apple-touch-icon" href="icons/180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="צייד הדירות">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 3.5l8.5 7.5"/><path d="M5.5 9.5v11h13v-11"/><path d="M10 20.5v-6h4v6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.2 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></symbol>
  <symbol id="i-pair" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M5 12h14"/><path d="M9 7.5h2M13 7.5h2M9 16h2M13 16h2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></symbol>
  <symbol id="i-source" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M3.5 6.5h.01M3.5 12h.01M3.5 17.5h.01"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v6h-6"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14.5 3.5h6v6"/><path d="M10 14 20.5 3.5"/><path d="M20.5 14v5.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2H11"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3.5 3.5l17 17"/><path d="M10.6 5.6A9.6 9.6 0 0 1 12 5.5c5 0 8.5 4.5 9.5 6.5a14 14 0 0 1-3 3.8M6.4 6.9C4.4 8.3 3 10.4 2.5 12c1 2 4.5 6.5 9.5 6.5 1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-4.4A8.5 8.5 0 1 1 20.5 11.5z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3.5 6.5h17M9 6.5v-3h6v3M5.5 6.5l1 14h11l1-14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4.5v15M6 13.5l6 6 6-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5v-3a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6.5 9.2 17.3 4 12.1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5 19.5 12 7 19.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 4.5v15M15.5 4.5v15"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand"><img src="icons/48.png" alt=""><span>צייד הדירות</span></div>
    <label class="profile-pick" title="פרופיל חיפוש">
      <select id="profileSel"></select>
    </label>
    <div class="search"><svg class="ico sm"><use href="#i-search"/></svg><input type="search" id="q" placeholder="חיפוש חופשי: רחוב, שכונה, מילה במודעה…"></div>
    <div class="grow"></div>
    <span class="scan-status" id="scanStatus"></span>
    <button class="btn icon mobile-only" id="searchBtn" title="חיפוש" aria-label="חיפוש"><svg class="ico"><use href="#i-search"/></svg></button>
    <button class="btn primary" id="scanBtn" title="סרוק עכשיו"><svg class="ico sm"><use href="#i-sync"/></svg><span>סרוק עכשיו</span><i class="scan-dot" id="scanDot"></i></button>
  </header>

  <nav class="rail" id="rail">
    <a href="#listings" data-view="listings"><svg class="ico"><use href="#i-home"/></svg><span>דירות</span><i>דירות</i><em id="cntListings"></em></a>
    <a href="#favorites" data-view="favorites"><svg class="ico"><use href="#i-star"/></svg><span>מועדפים</span><i>מועדפים</i><em id="cntFav"></em></a>
    <a href="#pairs" data-view="pairs"><svg class="ico"><use href="#i-pair"/></svg><span>שתי דירות בבניין</span><i>זוגות</i><em id="cntPairs"></em></a>
    <div class="rail-sep">הגדרות החיפוש</div>
    <a href="#profile" data-view="profile"><svg class="ico"><use href="#i-sliders"/></svg><span>פרופיל וקריטריונים</span><i>פרופיל</i></a>
    <a href="#sources" data-view="sources" class="secondary"><svg class="ico"><use href="#i-source"/></svg><span>מקורות</span><i>מקורות</i><em id="cntSources"></em></a>
    <a href="#notify" data-view="notify" class="secondary"><svg class="ico"><use href="#i-bell"/></svg><span>התראות</span><i>התראות</i></a>
    <a href="#settings" data-view="settings" class="secondary"><svg class="ico"><use href="#i-settings"/></svg><span>AI וכללי</span><i>הגדרות</i></a>
    <a href="#log" data-view="log" class="secondary"><svg class="ico"><use href="#i-log"/></svg><span>יומן סריקות</span><i>יומן</i></a>
    <a href="#more" data-view="more" class="more-tab"><svg class="ico"><use href="#i-menu"/></svg><span>עוד</span><i>עוד</i></a>
  </nav>

  <main class="main" id="main"></main>
</div>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true">
    <button class="btn icon ghost drawer-x" data-close aria-label="סגור"><svg class="ico"><use href="#i-x"/></svg></button>
    <div id="drawerBody"></div>
  </div>
</aside>

<span id="who" hidden></span>
<script type="module" src="app.js"></script>
</body>
</html>
